# =============================================================================
# CorbanPlus (Corbot) — Nginx Proxy Manager (NPM)
#
# Use este arquivo só como REFERÊNCIA: copie os blocos para o NPM.
# Hostnames assumem container_name do docker-compose.prod.yml:
#   Frontend (admin):        corbanplus_frontend:3000
#   Portal (parceiros/etc.): corbanplus_portal:3001
#   Backend:                 corbanplus_web:8000
#
# Se você renomeou, troque nos campos Forward do NPM.
#
# O stack DEVE estar na MESMA rede Docker que o NPM (proxy-network).
# =============================================================================


# -----------------------------------------------------------------------------
# PASSO 1 — Proxy Host principal (aba "Details")
# -----------------------------------------------------------------------------
#
#   Domain Names:        seu-dominio.com.br
#   Scheme:              http
#   Forward Hostname:    corbanplus_frontend
#   Forward Port:        3000
#
#   ☑ Block Common Exploits
#   ☑ Websockets Support   (recomendado; não atrapalha produção)
#
# Aba "SSL": pedir certificado Let's Encrypt + ☑ Force SSL + HTTP/2


# -----------------------------------------------------------------------------
# PASSO 1b — Proxy Host do Portal (parceiros/gerentes/vendedores) — outro Proxy
#            Host, domínio/subdomínio próprio (aba "Details")
# -----------------------------------------------------------------------------
#
#   Domain Names:        portal.seu-dominio.com.br
#   Scheme:              http
#   Forward Hostname:    corbanplus_portal
#   Forward Port:        3001
#
#   ☑ Block Common Exploits
#   ☑ Websockets Support   (não é usado pelo Portal hoje, mas não atrapalha)
#
# Aba "SSL": pedir certificado Let's Encrypt + ☑ Force SSL + HTTP/2
#
# Repita os PASSOS 2, 3 e 4 abaixo (Advanced + Custom locations) TAMBÉM neste
# Proxy Host do Portal, apontando /api/, /media/ e /static/ para corbanplus_web:8000
# — mesmo backend Django do admin, o Portal só reaproveita a API.


# -----------------------------------------------------------------------------
# PASSO 2 — Aba "Advanced" do MESMO Proxy Host (global, opcional)
# -----------------------------------------------------------------------------
# Limite de upload (propostas em lote / Excel). Ajuste o valor se precisar.

client_max_body_size 100M;


# -----------------------------------------------------------------------------
# PASSO 3 — Custom locations (aba "Custom locations" do Proxy Host)
# -----------------------------------------------------------------------------
#
# Adicione UMA entrada por linha abaixo. No NPM:
#   - Location: coloque o "Path"
#   - Forward Hostname / IP: coloque o "Host"
#   - Forward Port: coloque a "Porta"
#   - Websockets: só marque ON na linha /ws/
#
#   Path        Host                    Port   Websockets
#   ----------  ----------------------  -----  ----------
#   /api/       corbanplus_web          8000   OFF
#   /ws/        corbanplus_web          8000   ON
#   /media/     corbanplus_web          8000   OFF
#   /static/    corbanplus_web          8000   OFF
#   /admin/     corbanplus_web          8000   OFF
#
# Observação: o backend Django expõe /api/ (sem /v1/). Não use /api/v1/ aqui.
#
# Se algo "cair" no frontend por engano, tente listar /ws/ antes de paths mais
# genéricos (depende da versão do NPM).


# -----------------------------------------------------------------------------
# PASSO 4 — Snippets por location (campo "Custom Nginx Configuration" de CADA
#           custom location, quando existir; senão use a aba Advanced com cuidado)
# -----------------------------------------------------------------------------

# === Cole SOMENTE na custom location /api/ ===
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 60s;
proxy_read_timeout 300s;
proxy_send_timeout 300s;


# === Cole SOMENTE na custom location /ws/ ===
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 86400s;


# === Cole SOMENTE na custom location /media/ ===
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 300s;


# === Cole SOMENTE na custom location /static/ ===
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 120s;


# === Cole SOMENTE na custom location /admin/ ===
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 120s;


