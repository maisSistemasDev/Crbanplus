# Stack de produção do CorbanPlus (Portainer + Nginx Proxy Manager + PgBouncer).
#
# Variáveis de ambiente: configure no Portainer (Stacks → Add/Edit → "Environment variables")
# ou via arquivo .env anexado à stack.
#
# Rede do NPM: "proxy-network" deve existir antes desta stack.
# NPM (proxy /api/, /ws/, /media/, etc.): deploy/npm-corbot-reference.conf
#
# IMPORTANTE — PUBLIC_API_URL / PUBLIC_WS_URL NÃO devem ser definidas no frontend:
#   Astro embute PUBLIC_* no bundle em build-time; env no container não altera o JS do browser.
#   O browser usa URLs relativas (/api/, /ws/) e o NPM roteia para o backend.

services:
  postgres:
    image: postgres:15-alpine
    container_name: corbanplus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - corbot_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: corbanplus_pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      # transaction mode: melhor performance; reaproveita conexões por transação.
      # Exige DB_PGBOUNCER=True no Django (já configurado em settings.py).
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      ADMIN_USERS: ${DB_USER}
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-200}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-25}
      MIN_POOL_SIZE: ${PGBOUNCER_MIN_POOL_SIZE:-5}
      RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-5}
      RESERVE_POOL_TIMEOUT: "3"
      SERVER_RESET_QUERY: DISCARD ALL
      SERVER_IDLE_TIMEOUT: "600"
      QUERY_WAIT_TIMEOUT: "120"
      LOG_CONNECTIONS: "0"
      LOG_DISCONNECTIONS: "0"
    networks:
      - corbot_internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # pgbouncer responde como um Postgres na porta 5432
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $$DB_USER -d $$DB_NAME || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: corbanplus_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - corbot_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: maissistemasdev/corbanplus-backend:latest
    container_name: corbanplus_web
    restart: unless-stopped
    command: >
      sh -c "python3 manage.py wait_for_db &&
             python3 manage.py migrate --noinput &&
             python3 manage.py collectstatic --noinput &&
             python3 -m daphne -b 0.0.0.0 -p 8000 corbot.asgi:application"
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DJANGO_READ_DOTENV_LOCAL: "False"
      # Banco via PgBouncer (não fala direto com o postgres)
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: pgbouncer
      DB_PORT: "5432"
      DB_PGBOUNCER: "True"
      DB_CONN_MAX_AGE: "0"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      TRANSFEERA_API_CLIENT_ID: ${TRANSFEERA_API_CLIENT_ID}
      TRANSFEERA_API_CLIENT_SECRET: ${TRANSFEERA_API_CLIENT_SECRET}
      SYSTEM_NAME: ${SYSTEM_NAME}
      SYSTEM_LOGO_URL: ${SYSTEM_LOGO_URL}
    volumes:
      - corbot_media:/app/media
      - corbot_static:/app/staticfiles
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - corbot_internal
      - proxy-network

  celery:
    image: maissistemasdev/corbanplus-backend:latest
    container_name: corbanplus_celery
    restart: unless-stopped
    command: python3 -m celery -A corbot worker --loglevel=info
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      DJANGO_READ_DOTENV_LOCAL: "False"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: pgbouncer
      DB_PORT: "5432"
      DB_PGBOUNCER: "True"
      DB_CONN_MAX_AGE: "0"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      TRANSFEERA_API_CLIENT_ID: ${TRANSFEERA_API_CLIENT_ID}
      TRANSFEERA_API_CLIENT_SECRET: ${TRANSFEERA_API_CLIENT_SECRET}
    volumes:
      - corbot_media:/app/media
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - corbot_internal

  frontend:
    image: maissistemasdev/corbanplus-frontend:latest
    container_name: corbanplus_frontend
    # PUBLIC_API_URL / PUBLIC_WS_URL NÃO devem ser definidas aqui:
    # Astro embute PUBLIC_* no bundle em build-time; env no container não altera o JS do browser.
    # O browser usa URLs relativas (/api/, /ws/) e o NPM roteia para corbanplus_web:8000.
    restart: unless-stopped
    depends_on:
      - web
    networks:
      - corbot_internal
      - proxy-network

volumes:
  postgres_data:
  redis_data:
  corbot_media:
  corbot_static:

networks:
  corbot_internal:
    driver: bridge
  proxy-network:
    external: true
